# The package adopted the CustomResourceDefinitions and the admission policy installed by the previous owner.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  # The previous owner doesn't own any resource anymore.
  - script: test "$(kapp inspect -a previous-owner -n tests --json | jq '.Tables[0].Rows | length')" -eq 0
