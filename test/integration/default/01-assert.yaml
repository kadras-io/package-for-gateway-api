---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example
---
# The `edit` role manages the routes, and only reads the Gateways.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  - script: test "$(kubectl auth can-i create httproutes.gateway.networking.k8s.io -n $NAMESPACE --as=developer)" = yes
  - script: test "$(kubectl auth can-i delete referencegrants.gateway.networking.k8s.io -n $NAMESPACE --as=developer)" = yes
  - script: test "$(kubectl auth can-i list gateways.gateway.networking.k8s.io -n $NAMESPACE --as=developer)" = yes
  - script: test "$(kubectl auth can-i create gateways.gateway.networking.k8s.io -n $NAMESPACE --as=developer)" = no
