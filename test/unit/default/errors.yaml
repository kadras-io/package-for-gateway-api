# Every CustomResourceDefinition is kept on uninstall.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  (annotations."kapp.k14s.io/delete-strategy" != 'orphan'): true
---
# The Gateways are managed by the platform, so the default roles can't change them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gateway-api-edit
(rules[?contains(resources, 'gateways')] | length(@)): 1
